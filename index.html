<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>座位查詢</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:#202733;background:#f6f8fb;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-width:320px}
header{background:#fff;border-bottom:1px solid #e8edf3}
.header-inner{max-width:1100px;margin:auto;padding:22px 24px}
h1{font-size:clamp(24px,4vw,30px);margin:0;font-weight:750;letter-spacing:.02em}
main{max-width:1100px;margin:28px auto;padding:0 24px 48px;display:grid;gap:20px}
.panel{background:#fff;border:1px solid #e7ebf0;border-radius:16px;padding:22px;box-shadow:0 5px 18px rgba(20,35,55,.035)}
h2{font-size:19px;margin:0 0 18px;font-weight:700}
.search-row{display:flex;gap:10px}
input[type=text],input[type=url]{width:100%;min-width:0;border:1px solid #ccd5df;border-radius:10px;padding:12px 14px;font:inherit;background:#fff;outline:none}
input:focus{border-color:#527fc4;box-shadow:0 0 0 3px rgba(82,127,196,.13)}
button,.file-button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;background:#245da8;color:#fff;white-space:nowrap}
button:hover,.file-button:hover{filter:brightness(.95)}
button.secondary{background:#edf2f8;color:#26384d}
button.danger{background:#fff0f0;color:#a52c2c}
.result{margin-top:14px;min-height:24px;color:#3c4b5c}
.result strong{font-size:24px;color:#174f91}
.seat-viewport{overflow:auto;max-width:100%;border-radius:12px;background:#f8fafc;border:1px solid #edf0f4;padding:12px}
.seat-image{display:block;max-width:100%;height:auto;margin:auto;transform-origin:top left;cursor:zoom-in}
.seat-image.zoomed{max-width:none;width:140%;cursor:zoom-out}
.seat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:12px}
.seat{min-height:76px;border:1px solid #dce4ed;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.seat.active{border:2px solid #2767b5;background:#eaf3ff}
.seat-number{font-size:19px;font-weight:750;color:#244e7d}
.seat small{color:#718096}
.admin{display:none}
.admin.open{display:block}
.admin-grid{display:grid;gap:14px}
.admin-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.admin-row input[type=file]{max-width:100%}
.hint{font-size:13px;color:#687789;line-height:1.6}
.status{font-size:13px;color:#47704e;min-height:18px}
hr{border:0;border-top:1px solid #edf0f4;margin:18px 0}
@media(max-width:600px){
 .header-inner{padding:18px 16px}main{padding:0 14px 32px;margin:16px auto;gap:14px}
 .panel{padding:18px 15px;border-radius:13px}
 .search-row{flex-direction:column}
 .search-row button{width:100%}
 .seat-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .seat{min-height:68px}
}
</style>
</head>

<script>
(function(){
"use strict";
const KEY="seat_lookup_state_v1";
const embedded=document.getElementById("embedded-state").textContent.trim();
function decodeState(b64){
 try { const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)); return JSON.parse(new TextDecoder().decode(bytes)); }
 catch(e){ return {people:[],image:""}; }
}
const baseState=decodeState(embedded);
let state=baseState;
try { const saved=localStorage.getItem(KEY); if(saved){const parsed=JSON.parse(saved); if(Array.isArray(parsed.people)) state=parsed;} } catch(e){}
if(!Array.isArray(state.people)) state.people=[];
if(typeof state.image!=="string") state.image="";
const $=id=>document.getElementById(id);
const status=(msg)=>$("adminStatus").textContent=msg;
function persist(){
 try { localStorage.setItem(KEY,JSON.stringify(state)); status("更新已儲存於此裝置。"); }
 catch(e){ status("瀏覽器儲存空間不足，請改用較小的圖片。"); }
}
function uniqueSeats(){
 return [...new Set(state.people.map(p=>String(p.seat||"").trim()).filter(Boolean))]
   .sort((a,b)=>a.localeCompare(b,"zh-Hant",{numeric:true}));
}
function renderMap(highlight){
 const img=$("seatImage"), diagram=$("seatDiagram"), hint=$("imageHint");
 if(state.image){
   img.src=state.image; img.hidden=false; diagram.hidden=true; hint.hidden=false;
 }else{
   img.removeAttribute("src"); img.hidden=true; diagram.hidden=false; hint.hidden=true;
   diagram.replaceChildren();
   uniqueSeats().forEach(seat=>{
     const el=document.createElement("div"); el.className="seat"+(seat===highlight?" active":"");
     const number=document.createElement("div"); number.className="seat-number"; number.textContent=seat;
     const label=document.createElement("small"); label.textContent=seat===highlight?"查詢座位":"座位";
     el.append(number,label); diagram.append(el);
   });
 }
}
function search(){
 const value=$("nameInput").value.trim();
 if(value.toLowerCase()==="seat2026"){
   $("adminPanel").classList.add("open"); $("nameInput").value=""; $("result").textContent="";
   $("adminPanel").scrollIntoView({behavior:"smooth",block:"start"}); return;
 }
 if(!value){$("result").textContent="請先輸入姓名。";renderMap("");return;}
 const matches=state.people.filter(p=>String(p.name||"").trim()===value);
 if(!matches.length){$("result").textContent="查無此姓名，請確認輸入是否正確。";renderMap("");return;}
 const seats=[...new Set(matches.map(p=>String(p.seat||"").trim()).filter(Boolean))];
 $("result").replaceChildren();
 const line=document.createElement("span"); line.textContent="查詢結果：";
 const strong=document.createElement("strong"); strong.textContent=seats.join("、");
 const suffix=document.createElement("span"); suffix.textContent=" 號座位";
 $("result").append(line,strong,suffix);
 renderMap(seats[0]||"");
}
$("searchButton").addEventListener("click",search);
$("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")search();});
$("closeAdmin").addEventListener("click",()=>{$("adminPanel").classList.remove("open");});
function parseRows(rows){
 const cleaned=[];
 for(const row of rows){
   const name=String(row["姓名"]??row["name"]??"").trim();
   const seat=String(row["座位號碼"]??row["座位"]??row["seat"]??"").trim();
   if(name&&seat)cleaned.push({name,seat});
 }
 return cleaned;
}
function importCsv(text){
 const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());
 if(!lines.length)throw new Error("CSV 沒有資料");
 const delimiter=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?";":",";
 function split(line){
   const out=[];let cur="",quoted=false;
   for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'&&quoted){cur+='"';i++;}
     else if(c==='"')quoted=!quoted;else if(c===delimiter&&!quoted){out.push(cur);cur="";}else cur+=c;}
   out.push(cur);return out;
 }
 const headers=split(lines[0]).map(x=>x.trim());
 if(!headers.includes("姓名")||!headers.includes("座位號碼"))throw new Error("找不到「姓名」及「座位號碼」欄位");
 return lines.slice(1).map(line=>{const vals=split(line),o={};headers.forEach((h,i)=>o[h]=vals[i]??"");return o;});
}
$("excelFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
   let rows;
   if(/\.csv$/i.test(file.name)){rows=importCsv(await file.text());}
   else{
     if(!window.XLSX)throw new Error("Excel 解析元件載入失敗，請改用 CSV 匯入。");
     const data=await file.arrayBuffer();const wb=XLSX.read(data,{type:"array",raw:false});
     const sheet=wb.Sheets[wb.SheetNames[0]];
     rows=XLSX.utils.sheet_to_json(sheet,{defval:"",raw:false});
     if(!rows.length||!Object.keys(rows[0]).includes("姓名")||!Object.keys(rows[0]).includes("座位號碼"))
       throw new Error("找不到「姓名」及「座位號碼」欄位");
   }
   const people=parseRows(rows);if(!people.length)throw new Error("沒有可匯入的姓名與座位號碼資料");
   state.people=people;persist();renderMap("");$("result").textContent="資料已更新。";
 }catch(err){status("匯入失敗："+err.message);}
 e.target.value="";
});
function csvCell(v){return '"'+String(v??"").replace(/"/g,'""')+'"';}
$("exportCsv").addEventListener("click",()=>{
 const csv="\uFEFF姓名,座位號碼\r\n"+state.people.map(p=>csvCell(p.name)+","+csvCell(p.seat)).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});downloadBlob(blob,"座位資料.csv");
});
function downloadBlob(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("imageFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 if(!["image/jpeg","image/png"].includes(file.type)){status("請選擇 JPG 或 PNG 圖片。");return;}
 try{state.image=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=reject;r.readAsDataURL(file);});
 persist();renderMap("");status("座位圖已更新。");}catch(err){status("圖片讀取失敗。");}
 e.target.value="";
});
$("useImageUrl").addEventListener("click",()=>{
 const url=$("imageUrl").value.trim();
 try{const u=new URL(url);if(!["http:","https:"].includes(u.protocol))throw 0;state.image=u.href;persist();renderMap("");status("已套用圖片網址。下載更新版時會嘗試將圖片一併封裝。");}
 catch(e){status("請輸入有效的 http 或 https 圖片網址。");}
});
$("seatImage").addEventListener("click",e=>e.currentTarget.classList.toggle("zoomed"));
async function imageAsDataUrl(url){
 if(url.startsWith("data:"))return url;
 const response=await fetch(url,{mode:"cors"});if(!response.ok)throw new Error("圖片無法讀取");
 const blob=await response.blob();
 return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=reject;r.readAsDataURL(blob);});
}
$("downloadHtml").addEventListener("click",async()=>{
 status("正在準備更新版 HTML…");
 try{
   let exportState={people:state.people,image:state.image};
   if(exportState.image&&!exportState.image.startsWith("data:")){
     try{exportState.image=await imageAsDataUrl(exportState.image);}
     catch(e){throw new Error("圖片網址禁止跨網域讀取，無法封裝。請先下載圖片，再以 JPG/PNG 檔案上傳。");}
   }
   const encoded=btoa(Array.from(new TextEncoder().encode(JSON.stringify(exportState)),b=>String.fromCharCode(b)).join(""));
   const source="<!doctype html>"+document.documentElement.outerHTML;
   const updated=source.replace(/(<script id="embedded-state" type="application\/octet-stream">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encoded+b);
   downloadBlob(new Blob([updated],{type:"text/html;charset=utf-8"}),"座位查詢_更新版.html");
   status("更新版 HTML 已產生，內含目前資料與座位圖。");
 }catch(err){status(err.message);}
});
renderMap("");
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

</body></html>
